let html5QrCode;
const grid = document.getElementById('productsGrid');
const searchInput = document.getElementById('searchInput');
const categoryFilter = document.getElementById('categoryFilter');
const resultCount = document.getElementById('resultCount');
const toast = document.getElementById('toast');

function openModal(id) { const el = document.getElementById(id); el.classList.remove('hidden'); el.classList.add('flex'); }
function closeModal(id) { const el = document.getElementById(id); el.classList.add('hidden'); el.classList.remove('flex'); }

const logoBtn = document.getElementById('logoBtn');
let tapCount = 0; let tapTimer;
logoBtn.addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 3000);
    if (tapCount === 8) {
        tapCount = 0;
        openModal('adminLoginModal');
    }
});

document.getElementById('closeAdminLogin').addEventListener('click', () => closeModal('adminLoginModal'));
document.getElementById('btnAdminLogin').addEventListener('click', () => {
    const pass = document.getElementById('adminPasswordInput').value;
    if (btoa(pass) === ADMIN_PASSWORD_HASHED) {
        closeModal('adminLoginModal');
        openModal('adminDashboardModal');
    } else {
        showToast('كلمة السر غلط يا صاحبي!', '#ef4444');
    }
});

document.getElementById('closeAdminDashboard').addEventListener('click', () => closeModal('adminDashboardModal'));

// توليد كود التحديث للنشر على GitHub
document.getElementById('btnExportCode').addEventListener('click', () => {
    const codeArea = document.getElementById('exportCodeArea');
    const codeString = `const defaultData = ${JSON.stringify(appData, null, 4)};`;
    codeArea.value = codeString;
    codeArea.classList.remove('hidden');
    codeArea.select();
    navigator.clipboard.writeText(codeString).then(() => {
        showToast('اتنسخ الكود يا صاحبي! حطه في GitHub مكان defaultData');
    }).catch(() => {
        showToast('انسخ الكود من الصندوق الأسود يدوياً');
    });
});

document.getElementById('excelFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        try {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            const newData = [];
            for (let i = 1; i < rawData.length; i++) {
                const row = rawData[i];
                if (row && row[1]) { 
                    newData.push({
                        code: String(row[1] || '').trim(),
                        category: String(row[2] || '').trim(),
                        name: String(row[3] || '').trim(),
                        price: String(row[4] || '0').trim(),
                        notes: String(row[5] || '').trim()
                    });
                }
            }
            if (newData.length > 0) {
                appData = newData;
                localStorage.setItem('plData', JSON.stringify(appData));
                populateCategories(); filterAndRender(); showToast('تم رفع الأسعار بنجاح! 🚀');
            }
        } catch (error) { showToast('حصلت مشكلة في قراءة الملف', '#ef4444'); }
    };
    reader.readAsArrayBuffer(file);
});

function populateCategories() {
    const categories = [...new Set(appData.map(item => item.category))].sort();
    categoryFilter.innerHTML = '<option value="all">كل المجموعات</option>';
    categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat; option.textContent = cat;
        categoryFilter.appendChild(option);
    });
}

function filterAndRender() {
    const query = searchInput.value.trim().toLowerCase();
    const selectedCategory = categoryFilter.value;
    let filtered = appData;
    if (selectedCategory !== 'all') { filtered = filtered.filter(p => p.category === selectedCategory); }
    if (query) {
        filtered = filtered.filter(p => 
            p.code.toLowerCase().includes(query) ||
            p.name.toLowerCase().includes(query) ||
            p.price.toLowerCase().includes(query) ||
            p.notes.toLowerCase().includes(query)
        );
    }
    renderProducts(filtered);
}

function renderProducts(data) {
    grid.innerHTML = '';
    if (data.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fas fa-search-minus text-4xl mb-3"></i><br>مفيش نتائج ياسطا!</div>`;
        resultCount.textContent = '0'; return;
    }
    resultCount.textContent = data.length;
    data.forEach((p, index) => {
        const card = document.createElement('div');
        card.className = 'card-glass rounded-3xl p-5 flex flex-col gap-3 fade-in cursor-pointer';
        card.style.animationDelay = `${index * 0.03}s`;
        card.innerHTML = `
            <div class="flex justify-between items-start">
                <span class="code-badge text-sm font-mono px-3 py-1 rounded-lg">${p.code}</span>
                <span class="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded">${p.category}</span>
            </div>
            <h3 class="text-slate-800 text-lg font-bold leading-snug">${p.name}</h3>
            <div class="text-slate-500 text-sm flex items-center gap-2"><i class="fas fa-info-circle text-sky-400"></i> ${p.notes}</div>
            <div class="mt-auto pt-3 border-t border-slate-100 flex justify-between items-center">
                <span class="text-slate-400 text-sm">السعر</span>
                <span class="price-badge text-2xl font-black">${p.price} <span class="text-sm font-light">ج.م</span></span>
            </div>`;
        card.addEventListener('click', () => showProductModal(p));
        grid.appendChild(card);
    });
}

searchInput.addEventListener('input', filterAndRender);
categoryFilter.addEventListener('change', filterAndRender);

function showProductModal(p) {
    document.getElementById('modalContent').innerHTML = `
        <div class="text-center">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-sky-500 to-emerald-500 rounded-3xl flex items-center justify-center text-3xl mb-4 shadow-lg shadow-sky-500/20">
                <i class="fas fa-barcode text-white"></i>
            </div>
            <span class="code-badge text-sm font-mono px-4 py-2 rounded-lg">${p.code}</span>
            <h3 class="text-slate-800 text-2xl font-black my-4">${p.name}</h3>
            <div class="bg-slate-50 p-4 rounded-2xl text-right space-y-3 text-sm border border-slate-100">
                <div class="flex justify-between border-b border-slate-200 pb-2"><span class="text-slate-500">المجموعة</span><span class="text-sky-600 font-bold">${p.category}</span></div>
                <div class="flex justify-between border-b border-slate-200 pb-2"><span class="text-slate-500">الملاحظات</span><span class="text-slate-700">${p.notes}</span></div>
                <div class="flex justify-between items-center pt-2"><span class="text-slate-500 text-lg">السعر</span><span class="price-badge text-3xl font-black">${p.price} ج.م</span></div>
            </div>
        </div>`;
    openModal('productModal');
}

document.getElementById('closeModal').addEventListener('click', () => closeModal('productModal'));
document.getElementById('productModal').addEventListener('click', (e) => { if (e.target.id === 'productModal') closeModal('productModal'); });

const scannerSection = document.getElementById('scannerSection');
document.getElementById('btnScan').addEventListener('click', () => { scannerSection.classList.remove('hidden'); startScanner(); });
document.getElementById('btnCloseScan').addEventListener('click', () => { scannerSection.classList.add('hidden'); stopScanner(); });

function startScanner() {
    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 150 } };
    html5QrCode.start({ facingMode: "environment" }, config, 
        (decodedText) => {
            stopScanner(); scannerSection.classList.add('hidden'); searchInput.value = decodedText;
            const found = appData.find(p => p.code.toLowerCase() === decodedText.toLowerCase());
            if (found) {
                categoryFilter.value = 'all'; filterAndRender(); showProductModal(found); showToast('تم العثور على الصنف! 🎯');
            } else { showToast(`مفيش صنف بالكود ده: ${decodedText}`, '#ef4444'); filterAndRender(); }
        }, (errorMessage) => {}
    ).catch(err => { showToast('الكاميرا مش شغالة', '#ef4444'); });
}
function stopScanner() { if (html5QrCode && html5QrCode.isRunning) { html5QrCode.stop().then(() => html5QrCode.clear()).catch(err => console.error(err)); } }

function showToast(msg, color = '#059669') {
    toast.textContent = msg; toast.style.backgroundColor = color; toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

populateCategories(); filterAndRender();
</script>
</body>
</html>
